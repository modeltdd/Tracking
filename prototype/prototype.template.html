<title>ระบบติดตามสถานะผลงานวิชาการ — Interactive Prototype (เขตสุขภาพที่ 11)</title>
<style>
@font-face{font-family:'Sarabun';font-style:normal;font-weight:400;font-display:swap;
  src:url(data:font/woff2;base64,{{F400_THAI}}) format('woff2');
  unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC;}
@font-face{font-family:'Sarabun';font-style:normal;font-weight:400;font-display:swap;
  src:url(data:font/woff2;base64,{{F400_LATIN}}) format('woff2');
  unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122;}
@font-face{font-family:'Sarabun';font-style:normal;font-weight:600;font-display:swap;
  src:url(data:font/woff2;base64,{{F600_THAI}}) format('woff2');
  unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC;}
@font-face{font-family:'Sarabun';font-style:normal;font-weight:600;font-display:swap;
  src:url(data:font/woff2;base64,{{F600_LATIN}}) format('woff2');
  unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122;}
@font-face{font-family:'Sarabun';font-style:normal;font-weight:700;font-display:swap;
  src:url(data:font/woff2;base64,{{F700_THAI}}) format('woff2');
  unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC;}
@font-face{font-family:'Sarabun';font-style:normal;font-weight:700;font-display:swap;
  src:url(data:font/woff2;base64,{{F700_LATIN}}) format('woff2');
  unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122;}

:root{
  --bg:#f4f6f8; --surface:#ffffff; --surface-muted:#eef1f4; --surface-sunken:#e4e9ed;
  --border:#dde3e8; --border-soft:#e8edf0;
  --ink:#1c2b3a; --ink-muted:#5b6b78; --ink-faint:#8a97a3;
  --brand-700:#2b5271; --brand-600:#35648a; --brand-500:#4a7ea3; --brand-100:#e2ecf1;
  --accent:#3f9c8d; --accent-100:#e0f2ee;
  --chrome-bg:#1f3b54; --chrome-ink:#eaf2f6; --chrome-muted:#a9c2d1; --chrome-active:rgba(255,255,255,.14);
  --st-done-bg:#e1f3e6; --st-done-ink:#1f7a3d;
  --st-active-bg:#e3edfa; --st-active-ink:#1f5fae;
  --st-pending-bg:#eef0f2; --st-pending-ink:#6b7680;
  --st-revision-bg:#fdefdf; --st-revision-ink:#b5650a;
  --st-danger-bg:#fbe4e4; --st-danger-ink:#b23a3a;
  --shadow-sm:0 1px 2px rgba(20,40,55,.07), 0 1px 1px rgba(20,40,55,.06);
  --shadow-md:0 10px 28px rgba(20,40,55,.14);
  --radius:10px; --radius-sm:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1720; --surface:#152230; --surface-muted:#111c27; --surface-sunken:#0c1620;
    --border:#22333f; --border-soft:#1b2932;
    --ink:#e6edf2; --ink-muted:#93a4b0; --ink-faint:#61717c;
    --brand-700:#8fc2dd; --brand-600:#6fb0d1; --brand-500:#4a7ea3; --brand-100:#152936;
    --accent:#5cd0bd; --accent-100:#0f2c28;
    --st-done-bg:#123522; --st-done-ink:#6fd39a;
    --st-active-bg:#132a42; --st-active-ink:#7db2ec;
    --st-pending-bg:#182229; --st-pending-ink:#93a4b0;
    --st-revision-bg:#3a2712; --st-revision-ink:#f2b25a;
    --st-danger-bg:#3a1616; --st-danger-ink:#f19a9a;
    --shadow-sm:0 1px 2px rgba(0,0,0,.35); --shadow-md:0 14px 34px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#0e1720; --surface:#152230; --surface-muted:#111c27; --surface-sunken:#0c1620;
  --border:#22333f; --border-soft:#1b2932;
  --ink:#e6edf2; --ink-muted:#93a4b0; --ink-faint:#61717c;
  --brand-700:#8fc2dd; --brand-600:#6fb0d1; --brand-500:#4a7ea3; --brand-100:#152936;
  --accent:#5cd0bd; --accent-100:#0f2c28;
  --st-done-bg:#123522; --st-done-ink:#6fd39a;
  --st-active-bg:#132a42; --st-active-ink:#7db2ec;
  --st-pending-bg:#182229; --st-pending-ink:#93a4b0;
  --st-revision-bg:#3a2712; --st-revision-ink:#f2b25a;
  --st-danger-bg:#3a1616; --st-danger-ink:#f19a9a;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35); --shadow-md:0 14px 34px rgba(0,0,0,.45);
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Sarabun',system-ui,sans-serif; font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0; font-weight:700; text-wrap:balance;}
button,input,select,textarea{font-family:inherit;}
::selection{background:var(--brand-100);}
:focus-visible{outline:2px solid var(--brand-500); outline-offset:2px;}
a{color:var(--brand-700);}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important; transition-duration:.001ms !important;}}

/* ---------- prototype-only chrome ---------- */
.proto-bar{
  position:sticky; top:0; z-index:50; background:var(--surface); border-bottom:1px dashed var(--border);
  padding:9px 14px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:.78rem;
}
.proto-bar b{color:var(--ink-faint); font-weight:600; letter-spacing:.02em;}
.portal-switch{display:flex; gap:4px; background:var(--surface-muted); padding:3px; border-radius:999px;}
.portal-switch button{
  border:none; background:transparent; padding:6px 13px; border-radius:999px; font-size:.78rem; font-weight:600;
  color:var(--ink-muted); cursor:pointer;
}
.portal-switch button.active{background:var(--chrome-bg); color:var(--chrome-ink);}
.proto-hint{color:var(--ink-faint); margin-left:auto;}

#app{min-height:calc(100vh - 40px);}

/* ---------- generic ---------- */
.wrap{max-width:1180px; margin:0 auto; padding:18px;}
.wrap-narrow{max-width:560px; margin:0 auto; padding:18px;}
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-sm);}
.card-h{padding:13px 16px; border-bottom:1px solid var(--border-soft); font-weight:600; font-size:.95rem; display:flex; justify-content:space-between; align-items:center; gap:8px;}
.card-b{padding:16px;}
.stack{display:flex; flex-direction:column; gap:14px;}
.row-between{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;}

.pill{display:inline-flex; align-items:center; gap:5px; font-size:.74rem; font-weight:600; padding:3px 10px; border-radius:999px; white-space:nowrap;}
.pill.done{background:var(--st-done-bg); color:var(--st-done-ink);}
.pill.active{background:var(--st-active-bg); color:var(--st-active-ink);}
.pill.pending{background:var(--st-pending-bg); color:var(--st-pending-ink);}
.pill.revision{background:var(--st-revision-bg); color:var(--st-revision-ink);}
.pill.danger{background:var(--st-danger-bg); color:var(--st-danger-ink);}
.dot{width:6px; height:6px; border-radius:50%; background:currentColor;}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border-radius:var(--radius-sm); border:1px solid transparent; font-weight:600; font-size:.9rem;
  padding:10px 16px; cursor:pointer; min-height:44px; transition:filter .15s, background .15s, border-color .15s;
  font-family:inherit;
}
.btn-primary{background:var(--chrome-bg); color:#fff;}
.btn-primary:hover{filter:brightness(1.15);}
.btn-accent{background:var(--accent); color:#08211c;}
.btn-outline{background:var(--surface); border-color:var(--border); color:var(--ink);}
.btn-outline:hover{border-color:var(--brand-500); color:var(--brand-700);}
.btn-ghost{background:transparent; border-color:transparent; color:var(--brand-700);}
.btn-danger-outline{background:var(--surface); border-color:#e3b3b3; color:var(--st-danger-ink);}
.btn-block{width:100%;}
.btn-lg{padding:15px 18px; font-size:1rem;}
.btn-sm{padding:6px 12px; font-size:.8rem; min-height:34px;}
.btn:disabled{opacity:.45; cursor:not-allowed;}

label{display:block; font-size:.82rem; color:var(--ink-muted); margin-bottom:5px; font-weight:600;}
.field{margin-bottom:14px;}
.input, select.input, textarea.input{
  width:100%; border:1px solid var(--border); background:var(--surface); color:var(--ink);
  border-radius:var(--radius-sm); padding:11px 12px; font-size:1rem; font-family:inherit;
}
.input:focus{border-color:var(--brand-500);}
.hint{font-size:.76rem; color:var(--ink-faint); margin-top:4px;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px 16px;}
@media (max-width:560px){.grid2{grid-template-columns:1fr;}}
.tnum{font-variant-numeric:tabular-nums;}

.checklist{display:flex; flex-direction:column; gap:8px;}
.chk-row{display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); cursor:pointer; font-size:.9rem;}
.chk-row input{width:18px; height:18px; accent-color:var(--chrome-bg);}
.chk-row.checked{border-color:var(--brand-500); background:var(--brand-100);}

.switch{position:relative; width:38px; height:22px; flex:0 0 auto;}
.switch input{opacity:0; width:100%; height:100%; position:absolute; margin:0; cursor:pointer;}
.switch .track{position:absolute; inset:0; background:var(--surface-sunken); border-radius:999px; transition:background .15s;}
.switch .thumb{position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; box-shadow:var(--shadow-sm); transition:transform .15s;}
.switch input:checked + .track{background:var(--accent);}
.switch input:checked ~ .thumb{transform:translateX(16px);}

/* ---------- timeline ---------- */
.timeline{position:relative; margin-left:6px; padding-left:24px; border-left:2px solid var(--border-soft);}
.tl-item{position:relative; padding-bottom:20px;}
.tl-item:last-child{padding-bottom:0;}
.tl-item:before{content:""; position:absolute; left:-31px; top:2px; width:12px; height:12px; border-radius:50%; background:var(--st-pending-ink); border:2px solid var(--surface); box-shadow:0 0 0 2px var(--border);}
.tl-item.done:before{background:var(--st-done-ink); box-shadow:0 0 0 2px var(--st-done-ink);}
.tl-item.now:before{background:var(--st-active-ink); box-shadow:0 0 0 3px var(--st-active-bg);}
.tl-item .when{font-size:.74rem; color:var(--ink-faint);}
.tl-item .what{font-weight:700; font-size:.94rem; margin:2px 0;}
.tl-item .who{font-size:.82rem; color:var(--ink-muted);}
.tl-item .desc{font-size:.84rem; color:var(--ink-muted); margin-top:4px; max-width:56ch;}
.tl-item .note{font-size:.82rem; color:var(--ink-muted); background:var(--surface-muted); border-radius:8px; padding:7px 10px; margin-top:6px;}

/* ---------- public portal ---------- */
.pub-hero{text-align:center; padding:20px 10px 6px;}
.pub-badge{width:54px; height:54px; border-radius:14px; background:var(--chrome-bg); color:#fff; display:flex; align-items:center; justify-content:center; margin:0 auto 12px; font-size:1.3rem; font-weight:700;}
.pub-hero h1{font-size:1.2rem; color:var(--chrome-bg);}
.pub-hero p{color:var(--ink-muted); font-size:.9rem; margin-top:5px;}
:root[data-theme="dark"] .pub-hero h1, .proto-dark .pub-hero h1{color:var(--brand-700);}
.instr{background:var(--brand-100); color:var(--brand-700); font-size:.85rem; padding:12px 14px; border-radius:var(--radius-sm); margin:14px 0;}
.result-track{font-size:.82rem; color:var(--ink-muted);}
.result-owner{font-size:1.1rem; font-weight:700; margin:2px 0 12px;}
.dl{display:grid; grid-template-columns:auto 1fr; gap:7px 14px; font-size:.9rem;}
.dl dt{color:var(--ink-muted);}
.dl dd{margin:0; font-weight:600; text-align:right;}

.alert{border-radius:var(--radius-sm); padding:14px; display:flex; gap:10px; margin-top:14px;}
.alert.orange{background:var(--st-revision-bg); color:var(--st-revision-ink); border:1px solid #f0c98a;}
.alert .ico{font-size:1.2rem; flex:0 0 auto;}
.alert .body{font-size:.86rem; line-height:1.55;}
.alert .body b{display:block; margin-bottom:2px;}

.contact-box{font-size:.82rem; color:var(--ink-muted); text-align:center; margin-top:18px; padding-top:14px; border-top:1px dashed var(--border-soft);}

/* ---------- scanner ---------- */
.scanner{background:#0c1620; border-radius:var(--radius); aspect-ratio:4/3; max-width:320px; margin:0 auto; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center;}
.scanner .frame{width:62%; height:62%; border:2px solid #5cd0bd; border-radius:12px; position:relative;}
.scanner .frame:before,.scanner .frame:after{content:""; position:absolute; width:22px; height:22px; border-color:#fff;}
.scanner .line{position:absolute; left:8%; right:8%; height:2px; background:linear-gradient(90deg,transparent,#5cd0bd,transparent); animation:scan 2.1s ease-in-out infinite;}
@keyframes scan{0%{top:19%;} 50%{top:81%;} 100%{top:19%;}}
.scanner .cap{position:absolute; bottom:10px; left:0; right:0; text-align:center; color:#9fd; font-size:.72rem; letter-spacing:.03em;}
.scan-list{display:flex; flex-direction:column; gap:8px; margin-top:16px;}
.scan-chip{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px 14px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); cursor:pointer; text-align:left; min-height:44px;}
.scan-chip:hover{border-color:var(--brand-500);}
.scan-chip .t{font-size:.68rem; color:var(--ink-faint);}
.scan-chip strong{display:block; font-size:.88rem;}
.empty-state{text-align:center; color:var(--ink-faint); font-size:.85rem; padding:26px 10px;}

/* ---------- staff shell ---------- */
.staff-top{background:var(--chrome-bg); color:var(--chrome-ink); padding:14px 16px; display:flex; justify-content:space-between; align-items:center; gap:10px;}
.staff-top .org{font-size:.72rem; color:var(--chrome-muted);}
.staff-top .name{font-weight:700; font-size:.92rem;}
.staff-top button{background:rgba(255,255,255,.12); color:#fff; border:none; border-radius:999px; padding:6px 12px; font-size:.74rem; cursor:pointer;}
.staff-body{padding:16px 16px 90px; max-width:900px; margin:0 auto;}

.actiongrid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:18px;}
@media (max-width:640px){.actiongrid{grid-template-columns:1fr;}}
.actionbtn{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 14px;
  display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; cursor:pointer; box-shadow:var(--shadow-sm);
  min-height:44px;
}
.actionbtn .ico{font-size:1.6rem;}
.actionbtn .t{font-weight:700; font-size:.92rem;}
.actionbtn.primary{background:var(--chrome-bg); color:#fff; border-color:var(--chrome-bg);}
.actionbtn.primary .t{color:#fff;}

.stats2{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px;}
@media (max-width:640px){.stats2{grid-template-columns:repeat(2,1fr);}}
.stat{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; box-shadow:var(--shadow-sm);}
.stat .n{font-size:1.35rem; font-weight:700; font-variant-numeric:tabular-nums;}
.stat .l{font-size:.74rem; color:var(--ink-muted); margin-top:2px;}
.stat.warn .n{color:var(--st-revision-ink);}
.stat.danger .n{color:var(--st-danger-ink);}

.mywork-row{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:11px 4px; border-bottom:1px solid var(--border-soft);}
.mywork-row:last-child{border-bottom:none;}
.mywork-row .t{font-size:.68rem; color:var(--ink-faint);}
.mywork-row strong{font-size:.88rem; display:block;}
.mywork-row .sub{font-size:.78rem; color:var(--ink-muted);}

.bottomnav{
  position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--surface); border-top:1px solid var(--border);
  display:grid; grid-template-columns:repeat(5,1fr); padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  max-width:900px; margin:0 auto;
}
.bn-link{display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px; color:var(--ink-faint); font-size:.65rem; border:none; background:none; cursor:pointer; font-family:inherit;}
.bn-link.active{color:var(--chrome-bg);}
:root[data-theme="dark"] .bn-link.active{color:var(--brand-700);}
.bn-ico{font-size:1.05rem;}
.bn-link.qr{position:relative; top:-14px;}
.bn-link.qr .bn-ico{width:46px; height:46px; border-radius:50%; background:var(--accent); color:#08211c; display:flex; align-items:center; justify-content:center; font-size:1.3rem; box-shadow:var(--shadow-md);}

/* ---------- outcome / next-step ---------- */
.outcome-grid{display:flex; flex-direction:column; gap:10px; margin:14px 0;}
.outcome-btn{
  display:flex; align-items:center; justify-content:space-between; gap:10px; text-align:left;
  padding:15px 16px; border-radius:var(--radius-sm); border:1.5px solid var(--border); background:var(--surface);
  cursor:pointer; min-height:44px; font-size:.92rem; font-weight:700;
}
.outcome-btn .sub{font-weight:400; font-size:.76rem; color:var(--ink-muted); margin-top:2px;}
.outcome-btn.go{border-color:#bcd6c2;}
.outcome-btn.warn{border-color:#f0c98a;}
.outcome-btn.stop{border-color:#e3b3b3;}
.outcome-btn:hover{border-color:var(--brand-500);}

/* ---------- registry table/cards ---------- */
.filterbar{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:14px; align-items:end;}
.filterbar .field{margin-bottom:0; min-width:140px; flex:1 1 140px;}
.filterbar .field.grow{flex:2 1 200px;}
table.reg{width:100%; border-collapse:collapse; font-size:.86rem;}
table.reg th{text-align:left; font-size:.72rem; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em; font-weight:600; padding:9px 10px; border-bottom:1px solid var(--border);}
table.reg td{padding:11px 10px; border-bottom:1px solid var(--border-soft); vertical-align:middle;}
table.reg tbody tr:hover{background:var(--surface-muted); cursor:pointer;}
.namecell strong{display:block; font-size:.88rem;}
.namecell span{font-size:.76rem; color:var(--ink-muted);}
.table-wrap{overflow-x:auto;}
.reg-cards{display:none; flex-direction:column; gap:10px;}
.reg-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:13px 14px; box-shadow:var(--shadow-sm); cursor:pointer;}
.reg-card .top{display:flex; justify-content:space-between; gap:8px; align-items:flex-start;}
.reg-card .tno{font-size:.72rem; color:var(--ink-faint);}
.reg-card h4{font-size:.92rem; margin:2px 0 6px;}
.reg-card .meta{font-size:.79rem; color:var(--ink-muted); display:flex; flex-wrap:wrap; gap:4px 10px; margin:6px 0;}
@media (max-width:760px){.table-wrap{display:none;} .reg-cards{display:flex;}}

/* ---------- tabs ---------- */
.tabs{display:flex; gap:4px; overflow-x:auto; border-bottom:1px solid var(--border-soft); margin-bottom:14px;}
.tabbtn2{border:none; background:none; padding:10px 14px; font-size:.84rem; font-weight:600; color:var(--ink-muted); cursor:pointer; white-space:nowrap; border-bottom:2px solid transparent; font-family:inherit;}
.tabbtn2.active{color:var(--chrome-bg); border-color:var(--chrome-bg);}
:root[data-theme="dark"] .tabbtn2.active{color:var(--brand-700); border-color:var(--brand-700);}

/* ---------- QR box ---------- */
.qrbox{width:96px; height:96px; border-radius:8px; background:
  repeating-linear-gradient(0deg,var(--ink) 0 3px, transparent 3px 6px),
  repeating-linear-gradient(90deg,var(--ink) 0 3px, transparent 3px 6px);
  background-blend-mode:multiply; background-color:#fff; border:1px solid var(--border); flex:0 0 auto;}

/* ---------- intake ---------- */
.steps{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap;}
.step{display:flex; align-items:center; gap:7px; font-size:.78rem; color:var(--ink-faint); padding:6px 10px 6px 6px; border-radius:999px; background:var(--surface); border:1px solid var(--border);}
.step .num{width:20px; height:20px; border-radius:50%; background:var(--surface-sunken); color:var(--ink-muted); display:flex; align-items:center; justify-content:center; font-size:.7rem; font-weight:700;}
.step.done{color:var(--st-done-ink); border-color:#bfe3cd;}
.step.done .num{background:var(--st-done-bg); color:var(--st-done-ink);}
.step.now{color:var(--brand-700); border-color:var(--brand-500); font-weight:700;}
.step.now .num{background:var(--chrome-bg); color:#fff;}
.dropzone{border:2px dashed var(--border); border-radius:var(--radius); background:var(--surface-muted); aspect-ratio:3/4; max-width:230px; display:flex; align-items:center; justify-content:center; overflow:hidden;}
.cover-mock{width:100%; height:100%; background:linear-gradient(180deg,var(--brand-100),var(--surface-sunken)); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px; color:var(--brand-700);}
.cover-mock .doc{width:74%; height:80%; background:var(--surface); border:1px solid var(--border); border-radius:6px; position:relative;}
.cover-mock .doc:before,.cover-mock .doc:after{content:""; position:absolute; left:14%; right:14%; height:6px; background:var(--border); border-radius:3px;}
.cover-mock .doc:before{top:18%;} .cover-mock .doc:after{top:28%; right:34%;}
.confidence{font-size:.68rem; padding:2px 8px; border-radius:999px; font-weight:600; flex:0 0 auto;}
.confidence.high{background:var(--st-done-bg); color:var(--st-done-ink);}
.confidence.low{background:var(--st-revision-bg); color:var(--st-revision-ink);}
.input.unsure{border-color:#e0b64a; background:var(--st-revision-bg);}
.flabel-row{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}

/* ---------- admin ---------- */
.admin-app{display:grid; grid-template-columns:210px 1fr; min-height:100vh;}
@media (max-width:820px){.admin-app{grid-template-columns:1fr;}}
.admin-side{background:var(--chrome-bg); color:var(--chrome-ink); padding:16px 12px;}
@media (max-width:820px){.admin-side{display:none;}}
.admin-side .brand{color:#fff; font-weight:700; font-size:.92rem; padding:6px 8px 16px; border-bottom:1px solid rgba(255,255,255,.14); margin-bottom:10px; line-height:1.4;}
.admin-side .brand small{display:block; font-weight:400; opacity:.7; font-size:.7rem;}
.admin-link{display:flex; align-items:center; gap:9px; padding:10px 10px; border-radius:9px; color:var(--chrome-muted); font-size:.86rem; cursor:pointer; margin-bottom:2px;}
.admin-link.active{background:var(--chrome-active); color:#fff; font-weight:700;}
.admin-topbar-mobile{display:none;}
@media (max-width:820px){.admin-topbar-mobile{display:flex; gap:6px; overflow-x:auto; padding:10px 12px; background:var(--chrome-bg);}
  .admin-topbar-mobile button{flex:0 0 auto; border:none; background:rgba(255,255,255,.1); color:#fff; padding:7px 12px; border-radius:999px; font-size:.76rem; font-family:inherit;}
  .admin-topbar-mobile button.active{background:#fff; color:var(--chrome-bg);}
}
.admin-main{padding:18px 20px 50px; min-width:0;}
.dashgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px;}
@media (max-width:900px){.dashgrid{grid-template-columns:repeat(2,1fr);}}
.barlist{display:flex; flex-direction:column; gap:9px;}
.barrow{display:grid; grid-template-columns:150px 1fr 46px; align-items:center; gap:10px; font-size:.82rem;}
.barrow .track{height:9px; border-radius:999px; background:var(--surface-sunken); overflow:hidden;}
.barrow .fill{height:100%; border-radius:999px; background:var(--brand-500);}
.barrow .n{text-align:right; color:var(--ink-muted); font-variant-numeric:tabular-nums;}

.wf-row{display:grid; grid-template-columns:32px 1fr 130px 90px 1fr 40px; gap:10px; align-items:center; padding:11px 8px; border-bottom:1px solid var(--border-soft); font-size:.84rem;}
@media (max-width:900px){.wf-row{grid-template-columns:1fr; row-gap:6px;}}
.wf-order{display:flex; flex-direction:column; gap:2px;}
.wf-order button{border:1px solid var(--border); background:var(--surface); width:22px; height:20px; border-radius:4px; font-size:.65rem; cursor:pointer; line-height:1;}
.wf-name b{display:block; font-size:.88rem;}
.wf-name span{font-size:.76rem; color:var(--ink-muted);}

/* ---------- modal & toast ---------- */
.modal-back{position:fixed; inset:0; background:rgba(10,20,28,.5); display:flex; align-items:flex-end; justify-content:center; z-index:100; padding:0;}
@media (min-width:640px){.modal-back{align-items:center; padding:20px;}}
.modal-card{background:var(--surface); width:100%; max-width:460px; border-radius:16px 16px 0 0; box-shadow:var(--shadow-md); max-height:88vh; overflow-y:auto;}
@media (min-width:640px){.modal-card{border-radius:16px;}}
.modal-h{padding:16px 18px; font-weight:700; font-size:1.02rem; border-bottom:1px solid var(--border-soft);}
.modal-b{padding:16px 18px;}
.modal-f{padding:14px 18px; display:flex; gap:10px; justify-content:flex-end; border-top:1px solid var(--border-soft);}
.confirm-flow{display:flex; flex-direction:column; gap:8px; font-size:.9rem;}
.confirm-flow .step2{display:flex; align-items:center; gap:10px;}
.confirm-flow .arrow{color:var(--chrome-bg); font-weight:700;}

.toastwrap{position:fixed; left:0; right:0; bottom:16px; display:flex; justify-content:center; z-index:200; pointer-events:none;}
.toast{background:var(--chrome-bg); color:#fff; padding:12px 20px; border-radius:999px; font-size:.86rem; font-weight:600; box-shadow:var(--shadow-md); display:flex; align-items:center; gap:8px; animation:toastin .2s ease;}
@keyframes toastin{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}

.section-title{font-size:1.05rem; font-weight:700; margin-bottom:12px; color:var(--chrome-bg);}
:root[data-theme="dark"] .section-title{color:var(--brand-700);}
.muted-note{font-size:.78rem; color:var(--ink-faint); margin-top:6px;}
.login-list{display:flex; flex-direction:column; gap:10px;}
.login-opt{display:flex; align-items:center; gap:12px; padding:14px; border:1px solid var(--border); border-radius:var(--radius); cursor:pointer; background:var(--surface); text-align:left; min-height:44px;}
.login-opt:hover{border-color:var(--brand-500);}
.login-opt .av{width:38px; height:38px; border-radius:50%; background:var(--chrome-bg); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.85rem; flex:0 0 auto;}
.login-opt strong{display:block; font-size:.9rem;}
.login-opt span{font-size:.78rem; color:var(--ink-muted);}
</style>

<div class="proto-bar">
  <b>PROTOTYPE</b>
  <div class="portal-switch" id="portalSwitch"></div>
  <span class="proto-hint" id="protoHint"></span>
</div>
<div id="app"></div>
<div class="toastwrap" id="toastwrap"></div>

{{APP_JS}}
